const N=(q,a,u,e,x)=>({q,a,u,e,x}),M=(q,o,c,e)=>({q,o,c,e});
const B=[
{t:"Bài 1. Bảo hiểm tài sản",
s:"Công ty Minh Phát mua bảo hiểm vật chất cho một xe ô tô với các thông tin sau:\n1. Giá trị thực tế của xe tại thời điểm tham gia bảo hiểm: 900 triệu đồng.\n2. Số tiền bảo hiểm: 720 triệu đồng.\n3. Mức miễn thường: 8% giá trị tổn thất, nhưng không thấp hơn 3 triệu đồng/vụ.\n4. Hợp đồng còn hiệu lực tại thời điểm xảy ra tai nạn.\n5. Trước tai nạn, cụm đèn hậu bị tổn thất đã qua sử dụng và được xác định có tỷ lệ khấu hao 25%.\nTrong thời hạn bảo hiểm, xe gặp tai nạn thuộc phạm vi bảo hiểm. Các khoản thiệt hại và chi phí phát sinh:",
h:"<table><tr><th>Khoản mục</th><th>Số tiền</th></tr><tr><td>Sửa chữa thân vỏ và cửa xe do tai nạn</td><td>110 triệu</td></tr><tr><td>Thay cụm đèn hậu bị vỡ</td><td>20 triệu</td></tr><tr><td>Cứu hộ, kéo xe về garage</td><td>7 triệu</td></tr><tr><td>Cẩu xe khỏi vị trí nguy hiểm để hạn chế tổn thất</td><td>5 triệu</td></tr><tr><td>Thay lốp đã hỏng trước tai nạn</td><td>6 triệu</td></tr><tr><td>Sơn đổi màu toàn bộ xe theo yêu cầu chủ xe</td><td>25 triệu</td></tr><tr><td>Thuê xe khác trong thời gian sửa chữa</td><td>15 triệu</td></tr><tr><td>Giám định tổn thất theo yêu cầu DNBH</td><td>4 triệu</td></tr></table>",
q:[
M("Xác định các khoản hợp lý thuộc phạm vi xem xét bồi thường.",["Thân vỏ 110; đèn hậu 20; cứu hộ 7; cẩu xe 5; giám định 4","Thân vỏ 110; đèn hậu 20; cứu hộ 7; thay lốp 6; thuê xe 15","Thân vỏ 110; đèn hậu 20; cẩu xe 5; sơn đổi màu 25; giám định 4","Tất cả 8 khoản mục"],0,"Loại 3 khoản: lốp hỏng TRƯỚC tai nạn (không do rủi ro bảo hiểm), sơn đổi màu (theo ý chủ xe, không phải thiệt hại), thuê xe (thiệt hại gián tiếp).\nCòn lại là thiệt hại trực tiếp + chi phí cứu hộ/hạn chế tổn thất + giám định theo yêu cầu DNBH.\nMẹo: 'trực tiếp do tai nạn' hoặc 'cứu hộ - hạn chế tổn thất - giám định' thì tính."),
M("Xác định các khoản không thuộc trách nhiệm bồi thường.",["Thay lốp 6; sơn đổi màu 25; thuê xe 15 (tổng 46 triệu)","Thay lốp 6; cẩu xe 5; thuê xe 15","Sơn đổi màu 25; giám định 4; cứu hộ 7","Chỉ có thuê xe 15"],0,"Ba khoản loại: 6 + 25 + 15 = 46 triệu (xem lý do ở câu trước)."),
N("Xác định giá trị thực tế của cụm đèn hậu sau khấu hao.",15,"triệu đồng","20 × (1 − 25%) = 15 triệu.\nMẹo: nhân 0,75.",[5,25]),
N("Xác định tổng giá trị thiệt hại thực tế thuộc phạm vi bảo hiểm.",141,"triệu đồng","110 + 15 (đèn hậu đã khấu hao) + 7 + 5 + 4 = 141 triệu.\nMẹo: tổng 8 khoản = 192; trừ 46 khoản bị loại, trừ thêm 5 khấu hao đèn: 192 − 46 − 5 = 141.",[137,146,187]),
N("Xác định tỷ lệ giữa số tiền bảo hiểm và giá trị thực tế của xe.",80,"%","720 ÷ 900 = 80% < 100% → bảo hiểm dưới giá trị, bồi thường theo tỷ lệ 80%."),
N("Xác định số tiền bồi thường nếu áp dụng miễn thường không khấu trừ.",112.8,"triệu đồng","Mức miễn thường = max(8% × 141 = 11,28; 3) = 11,28. Tổn thất 141 > 11,28 → bồi thường đủ (không trừ miễn thường), nhân tỷ lệ 80%.\n141 × 0,8 = 112,8 triệu.\nMẹo: không khấu trừ = vượt ngưỡng thì trả trọn.",[141,101.52,129.72]),
N("Xác định số tiền bồi thường nếu áp dụng miễn thường có khấu trừ.",101.52,"triệu đồng","Bồi thường theo tỷ lệ trước, rồi trừ miễn thường: 141 × 0,8 − 11,28 = 112,8 − 11,28 = 101,52 triệu.",[112.8,129.72,100.8]),
N("Xác định mức thiệt hại mà tại đó số tiền bồi thường trong hai trường hợp miễn thường trên bằng nhau.",3,"triệu đồng","Không khấu trừ: tổn thất ≤ mức miễn thường thì trả 0, vượt thì trả đủ. Có khấu trừ: luôn trừ mức miễn thường.\nHai cách chỉ trùng nhau (cùng bằng 0) khi tổn thất ≤ mức miễn thường tối thiểu 3 triệu; vượt ngưỡng này cách không khấu trừ luôn trả nhiều hơn.\nĐáp số: 3 triệu.",[37.5,3.75,11.28]),
N("Nếu muốn bảo hiểm đúng giá trị, Công ty Minh Phát cần tăng số tiền bảo hiểm thêm bao nhiêu?",180,"triệu đồng","900 − 720 = 180 triệu."),
N("Nếu số tiền bảo hiểm được điều chỉnh lên 900 triệu đồng trước tai nạn, xác định lại số tiền bồi thường khi áp dụng miễn thường có khấu trừ.",129.72,"triệu đồng","Bảo hiểm đúng giá trị → tỷ lệ 100%: 141 − 11,28 = 129,72 triệu.",[112.8,101.52,141]),
N("Giá trị thiệt hại thực tế bằng bao nhiêu để số tiền bồi thường có miễn thường khấu trừ là 90 triệu đồng?",125,"triệu đồng","Gọi L là thiệt hại. Miễn thường = 8%L (khi L ≥ 37,5). Bồi thường = 0,8L − 0,08L = 0,72L = 90 → L = 125 triệu.\nKiểm tra: 8% × 125 = 10 ≥ 3 ✔.",[112.5,100,150])
]},
{t:"Bài 2. Bảo hiểm tài sản",
s:"Doanh nghiệp A mua bảo hiểm cháy, nổ cho một nhà xưởng:\n1. Giá trị bảo hiểm: 3 tỷ đồng.\n2. Số tiền bảo hiểm: 2,1 tỷ đồng.\n3. Thiệt hại thực tế do cháy: 800 triệu đồng.\n4. Mức khấu trừ: 30 triệu đồng/vụ.\n5. Tổn thất thuộc phạm vi bảo hiểm.\n6. Không có giá trị thu hồi và không có khoản bồi thường từ bên thứ ba.",
q:[
N("Xác định tỷ lệ bảo hiểm.",70,"%","2.100 ÷ 3.000 = 70%."),
N("Xác định số tiền bồi thường nếu chỉ áp dụng bồi thường theo tỷ lệ.",560,"triệu đồng","800 × 70% = 560 triệu."),
N("Xác định số tiền bồi thường nếu chỉ áp dụng tổn thất thứ nhất (rủi ro đầu tiên)",800,"triệu đồng","Rủi ro đầu tiên: bồi thường toàn bộ thiệt hại, tối đa bằng số tiền bảo hiểm: min(800; 2.100) = 800 triệu."),
N("Xác định số tiền bồi thường nếu chỉ áp dụng miễn thường có khấu trừ.",770,"triệu đồng","800 − 30 = 770 triệu."),
N("Xác định số tiền bồi thường nếu đồng thời áp dụng bồi thường theo tỷ lệ và mức khấu trừ.",530,"triệu đồng","800 × 70% − 30 = 560 − 30 = 530 triệu.\nMẹo: tỷ lệ trước, trừ khấu trừ sau.",[539,560,770]),
N("Nếu thiệt hại thực tế là 25 triệu đồng, người được bảo hiểm nhận được bao nhiêu khi áp dụng mức khấu trừ?",0,"triệu đồng","25 < 30 (mức khấu trừ) → không vượt khấu trừ → nhận 0 (không âm).",[5,25,30]),
N("Xác định số tiền bảo hiểm cần tăng thêm để tài sản được bảo hiểm đúng giá trị.",900,"triệu đồng","3.000 − 2.100 = 900 triệu."),
N("Trong trường hợp bồi thường theo tỷ lệ kết hợp mức khấu trừ, xác định tổng phần tổn thất doanh nghiệp phải tự gánh chịu.",270,"triệu đồng","800 − 530 = 270 triệu (gồm 240 do bảo hiểm dưới giá trị + 30 khấu trừ)."),
N("Giả sử số tiền bảo hiểm được nâng lên 3 tỷ đồng, xác định lại số tiền bồi thường khi áp dụng mức khấu trừ 30 triệu đồng.",770,"triệu đồng","Bảo hiểm đủ giá trị → không giảm theo tỷ lệ: 800 − 30 = 770 triệu."),
N("Xác định giá trị thiệt hại thực tế tối thiểu (> 0) để số tiền bồi thường của doanh nghiệp bảo hiểm trong hai trong trường hợp hợp đồng chỉ áp dụng điều khoản bồi thường theo tỷ lệ và trường hợp hợp đồng chỉ áp dụng điều khoản bồi thường theo rủi ro đầu tiên là bằng nhau?",3000,"triệu đồng","Nếu L ≤ 2.100: rủi ro đầu tiên trả L, tỷ lệ trả 0,7L → khác nhau.\nNếu L > 2.100: rủi ro đầu tiên trả tối đa 2.100; tỷ lệ trả 0,7L = 2.100 → L = 3.000 triệu (đúng bằng giá trị bảo hiểm).",[2100,2130,2400]),
N("Xác định giá trị thiệt hại thực tế tối thiểu (> 0) để số tiền bồi thường của doanh nghiệp bảo hiểm trong trường hợp hợp đồng chỉ áp dụng điều khoản bồi thường theo rủi ro đầu tiên và trường hợp hợp đồng chỉ áp dụng điều khoản miễn thường có khấu trừ bằng nhau?",2130,"triệu đồng","L ≤ 2.100: rủi ro đầu tiên trả L > L − 30.\nL > 2.100: rủi ro đầu tiên trả 2.100; khấu trừ trả L − 30 → 2.100 = L − 30 → L = 2.130 triệu.",[2100,3000,2070]),
N("Xác định giá trị thiệt hại thực tế tối thiểu (> 0) để số tiền bồi thường của doanh nghiệp bảo hiểm trong trường hợp hợp đồng chỉ áp dụng điều khoản bồi thường theo tỷ lệ và trường hợp hợp đồng chỉ áp dụng điều khoản miễn thường có khấu trừ bằng nhau?",100,"triệu đồng","0,7L = L − 30 → 0,3L = 30 → L = 100 triệu.\nKiểm tra: 70 = 100 − 30 ✔.",[30,90,210])
]},
{t:"Bài 3. Bảo hiểm tài sản - thế quyền",
s:"Công ty Bình Minh mua bảo hiểm cho kho hàng:\n1. Giá trị bảo hiểm: 1,5 tỷ đồng.\n2. Số tiền bảo hiểm: 1,2 tỷ đồng.\n3. Mức khấu trừ: 4% giá trị tổn thất, tối thiểu 8 triệu đồng/sự cố.\n4. Một vụ cháy thuộc phạm vi bảo hiểm gây thiệt hại 500 triệu đồng.\n5. Một người thứ ba được xác định chịu 70% trách nhiệm đối với thiệt hại.\n6. Người thứ ba có đầy đủ khả năng thực hiện nghĩa vụ bồi thường.\n7. Không có bảo hiểm trùng và không có giá trị thu hồi.",
q:[
M("Xác định tỷ lệ bảo hiểm và cho biết đây là bảo hiểm đúng, trên hay dưới giá trị.",["80% – bảo hiểm dưới giá trị","125% – bảo hiểm trên giá trị","100% – bảo hiểm đúng giá trị","70% – bảo hiểm dưới giá trị"],0,"1.200 ÷ 1.500 = 80% < 100% → bảo hiểm dưới giá trị."),
N("Xác định phần tổn thất thuộc trách nhiệm DNBH trước khấu trừ.",400,"triệu đồng","500 × 80% = 400 triệu."),
N("Xác định mức khấu trừ.",20,"triệu đồng","4% × 500 = 20 triệu > 8 (mức tối thiểu) → lấy 20 triệu.",[8,16,24]),
N("Xác định số tiền DNBH bồi thường cho Công ty Bình Minh.",380,"triệu đồng","400 − 20 = 380 triệu.",[400,392,350]),
N("Xác định trách nhiệm bồi thường của người thứ ba.",350,"triệu đồng","70% × 500 = 350 triệu."),
N("Xác định số tiền tối đa DNBH được thế quyền yêu cầu người thứ ba hoàn trả.",350,"triệu đồng","Thế quyền không vượt quá min(số tiền DNBH đã bồi thường; trách nhiệm người thứ ba) = min(380; 350) = 350 triệu.",[380,400,266]),
N("Xác định số tiền người thứ ba còn phải bồi thường trực tiếp cho Công ty Bình Minh.",0,"triệu đồng","Người thứ ba có trách nhiệm 350, DNBH thu hồi 350 qua thế quyền → còn 350 − 350 = 0 (DNBH thu hồi trước, trong phạm vi số đã trả).",[84,120,30]),
N("Xác định tổng số tiền Công ty Bình Minh nhận được.",380,"triệu đồng","Chỉ nhận 380 từ DNBH + 0 từ người thứ ba = 380 triệu.",[400,464,500]),
N("Xác định thiệt hại cuối cùng Công ty Bình Minh phải tự gánh chịu.",120,"triệu đồng","500 − 380 = 120 triệu (gồm 100 do dưới giá trị + 20 khấu trừ).",[36,20,100]),
N("Xác định thiệt hại cuối cùng của DNBH sau khi thực hiện quyền thế quyền.",30,"triệu đồng","380 − 350 = 30 triệu.",[114,0,20])

/* ---------- logic ---------- */
let mode='study',cb=0,ci=0;const R={},SUB={};
const $=id=>document.getElementById(id),L='ABCD';
const fmt=(v,u)=>v.toLocaleString('vi-VN',{maximumFractionDigits:2})+(u?' '+u:'');
const OP={};
function opts(b,i){const k=b+'-'+i;if(OP[k])return OP[k];const q=B[b].q[i];let a=q.a,c=(q.x||[]).slice();
 const f=q.u=='%'?[a-10,a+10,a-20,a+20]:[a*.8,a*1.25,a*.5,a*1.5,a+30,a*.9,a*2];
 for(const v of f){if(c.length>=3)break;const r=Math.round(v*100)/100;if(r>=0&&r!=a&&!c.includes(r)&&!(q.u=='%'&&r>100))c.push(r)}
 for(let k2=1;c.length<3;k2++){const r=a+k2*10;if(!c.includes(r))c.push(r)}
 c=c.slice(0,3);c.splice((i*3+b)%4,0,a);return OP[k]=c}
const isOk=(q,v)=>v!==undefined&&(q.o?v===q.c:Math.abs(v-q.a)<0.005);
const ok=(b,i)=>{const r=R[b+'-'+i];return !!r&&isOk(B[b].q[i],r.v)};
const fbk=(b,i)=>{const r=R[b+'-'+i]||{};return mode=='study'?(ok(b,i)||r.rev):!!SUB[b]};
function stat(b,i){const r=R[b+'-'+i];if(fbk(b,i))return ok(b,i)?'d1':'d3';return r&&r.v!==undefined&&mode=='exam'?'d2':''}
function pick(v){const k=cb+'-'+ci,r=R[k]=R[k]||{};if(fbk(cb,ci))return;r.v=v;
 if(mode=='study'&&ok(cb,ci))boom();render()}
function reveal(){const k=cb+'-'+ci;(R[k]=R[k]||{}).rev=true;render()}
function submit(){SUB[cb]=true;const c=B[cb].q.filter((_,i)=>ok(cb,i)).length;if(c==B[cb].q.length)boom();render()}
function go(d){ci=Math.min(B[cb].q.length-1,Math.max(0,ci+d));render()}
function setMode(m){mode=m;render()}
function setB(b){cb=b;ci=0;render()}
function chk(){const v=parseFloat($('nv').value);if(isNaN(v))return;pick(v)}
function syncN(){$('rg').value=$('nv').value}
function syncR(){$('nv').value=$('rg').value}

function render(){
 $('modes').innerHTML=[['study','📖 Ôn tập (đúng mới qua, có hướng dẫn)'],['exam','📝 Thi thử (nộp bài mới chấm)']].map(m=>`<button class="mode ${mode==m[0]?'on':''}" onclick="setMode('${m[0]}')">${m[1]}</button>`).join('');
 let tt=0,td=0;
 $('tabs').innerHTML=B.map((x,b)=>{const n=x.q.length;let d=0;for(let i=0;i<n;i++)if(fbk(b,i)&&ok(b,i))d++;tt+=n;td+=d;
  return `<button class="tab ${b==cb?'on':''}" onclick="setB(${b})">Bài ${b+1}<div class="c">${d}/${n} ✔</div></button>`}).join('');
 $('pb').style.width=(td/tt*100)+'%';$('tot').textContent=`Tiến độ: ${td}/${tt} câu đúng`;
 const bk=B[cb],q=bk.q[ci],k=cb+'-'+ci,r=R[k]||{},show=fbk(cb,ci),good=ok(cb,ci);
 let h=`<div class="card st"><h2>${bk.t}</h2>${bk.s}${bk.h||''}\n<b>Yêu cầu:</b></div>`;
 if(SUB[cb]&&mode=='exam'){const c=bk.q.filter((_,i)=>ok(cb,i)).length;h+=`<div class="score">🏁 Kết quả ${bk.t.split('.')[0]}: <b>${c}/${bk.q.length}</b> câu đúng (${Math.round(c/bk.q.length*100)}%) – xem từng câu để đọc hướng dẫn</div>`}
 h+=`<div class="card"><div class="qh">Câu ${ci+1}/${bk.q.length}</div><div class="qt">${q.q}</div>`;
 const list=q.o?q.o.map((t,i)=>[t,i]):opts(cb,ci).map(v=>[fmt(v,q.u),v]);
 list.forEach((o,j)=>{const isC=q.o?o[1]===q.c:Math.abs(o[1]-q.a)<.005,picked=r.v!==undefined&&(q.o?r.v===o[1]:Math.abs(r.v-o[1])<.005);
  let cl='';if(show){if(isC)cl='ok';else if(picked)cl='bad'}else if(picked)cl=mode=='study'?'bad':'sel';
  h+=`<button class="opt ${cl}" ${show?'disabled':''} onclick="pick(${typeof o[1]=='number'&&!q.o?o[1]:o[1]})"><b>${L[j]}</b><span>${o[0]}</span></button>`});
 if(!q.o){const a=q.a,step=q.u=='%'?1:a>=1000?1000:Number.isInteger(a)?1:.01,mx=q.u=='%'?100:Math.max(10,Math.ceil(a*2/step)*step),val=r.v!==undefined?r.v:0;
  h+=`<div class="num"><div class="row" style="justify-content:flex-start"><span>✍ Hoặc tự nhập / kéo chọn số (${q.u}):</span><input type="number" id="nv" step="${step}" value="${val}" oninput="syncN()" ${show?'disabled':''}><button class="go" ${show?'disabled':''} onclick="chk()">${mode=='study'?'Kiểm tra':'Chốt đáp án'}</button></div><input type="range" id="rg" min="0" max="${mx}" step="${step}" value="${val}" oninput="syncR()" ${show?'disabled':''}></div>`}
 if(mode=='study'){if(good)h+=`<div class="msg good">✔ Chính xác! Giỏi lắm!</div>`;else if(r.v!==undefined&&!r.rev)h+=`<div class="msg err">✘ Chưa đúng – thử lại nhé! <button onclick="reveal()">Xem đáp án & hướng dẫn</button></div>`;else if(!r.rev)h+=`<div class="msg" style="opacity:.8">Chọn đáp án hoặc nhập số rồi kiểm tra. Không giới hạn thời gian.</div>`}
 else if(!SUB[cb])h+=`<div class="msg" style="opacity:.85">${r.v!==undefined?'Đã chọn – có thể đổi trước khi nộp bài.':'Chưa trả lời.'}</div>`;
 if(show){const ans=q.o?q.o[q.c]:fmt(q.a,q.u);h+=`<div class="ex"><b>${good?'✔':'💡'} Đáp án chuẩn: ${ans}</b>\n${q.e}</div>`}
 h+=`<div class="row" style="margin-top:14px"><button onclick="go(-1)" ${ci==0?'disabled':''}>◀ Câu trước</button><button onclick="go(1)" ${ci==bk.q.length-1?'disabled':''}>Câu sau ▶</button>${mode=='exam'&&!SUB[cb]?`<button class="go" onclick="submit()">📨 Nộp bài ${cb+1}</button>`:''}</div></div>`;
 h+=`<div class="card dots"><div class="row">${bk.q.map((_,i)=>`<button class="${stat(cb,i)} ${i==ci?'cur':''}" onclick="ci=${i};render()">${i+1}</button>`).join('')}</div></div>`;
 $('app').innerHTML=h;
}

/* ---------- fireworks ---------- */
const cv=$('fw'),cx=cv.getContext('2d');let P=[],run=false;
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function boom(){for(let k=0;k<5;k++)setTimeout(()=>{const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.15+Math.random()*.45),hue=[270,220,45,0,300][k%5];
 for(let i=0;i<70;i++){const a=Math.random()*6.28,s=2+Math.random()*5;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:hue+Math.random()*30})}
 if(!run){run=true;loop()}},k*220)}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.985;p.l-=.014;cx.fillStyle=`hsla(${p.h},100%,60%,${p.l})`;cx.beginPath();cx.arc(p.x,p.y,2.6,0,6.28);cx.fill()}
 if(P.length)requestAnimationFrame(loop);else run=false}
render();
</script>
